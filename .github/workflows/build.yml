name: Build VYVO TikTok V1.1 Fixed
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Create TikTok Clone App
        run: |
          mkdir -p app/src/main/java/com/vyvo/app
          mkdir -p app/src/main/res/layout
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS) repositories { google(); mavenCentral() } }
          rootProject.name = "VYVO TikTok"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.1.4' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.vyvo.app'
            compileSdk 34
            defaultConfig { applicationId "com.vyvo.app"; minSdk 24; targetSdk 34; versionCode 3; versionName "1.1" }
            buildTypes { release { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.viewpager2:viewpager2:1.0.0'
            implementation 'androidx.media3:media3-exoplayer:1.2.1'
            implementation 'androidx.media3:media3-ui:1.2.1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="VYVO TikTok" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000">
            <androidx.viewpager2.widget.ViewPager2 android:id="@+id/viewPager" android:layout_width="match_parent" android:layout_height="match_parent" />
          </FrameLayout>
          EOF
          cat > app/src/main/res/layout/item_video.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000">
            <androidx.media3.ui.PlayerView xmlns:app="http://schemas.android.com/apk/res-auto" android:id="@+id/playerView" android:layout_width="match_parent" android:layout_height="match_parent" app:use_controller="false" app:resize_mode="zoom" />
            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:layout_gravity="bottom" android:padding="16dp">
              <TextView android:text="@vyvo_officiel" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#fff" android:textStyle="bold" android:textSize="16sp"/>
              <TextView android:text="VYVO TikTok V1 🔥 Like + Abonnés + LIVE bientôt" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#fff" android:layout_marginTop="4dp"/>
              <TextView android:id="@+id/btnLike" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="❤️ 12.5K • 💬 342 • ➕ S'abonner • 🔴 LIVE" android:textColor="#ff004f" android:textStyle="bold" android:textSize="16sp" android:paddingTop="12dp"/>
            </LinearLayout>
          </FrameLayout>
          EOF
          cat > app/src/main/java/com/vyvo/app/VideoAdapter.java <<'EOF'
          package com.vyvo.app;
          import android.content.Context; import android.view.*; import android.widget.*; import androidx.annotation.NonNull;
          import androidx.media3.common.MediaItem; import androidx.media3.exoplayer.ExoPlayer; import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.RecyclerView; import java.util.List;
          public class VideoAdapter extends RecyclerView.Adapter<VideoAdapter.VH> {
            Context ctx; List<String> urls;
            public VideoAdapter(Context c, List<String> u){ ctx=c; urls=u; }
            @NonNull @Override public VH onCreateViewHolder(@NonNull ViewGroup p, int t){ return new VH(LayoutInflater.from(ctx).inflate(R.layout.item_video, p, false)); }
            @Override public void onBindViewHolder(@NonNull VH h, int pos){
              ExoPlayer player = new ExoPlayer.Builder(ctx).build();
              h.playerView.setPlayer(player);
              player.setMediaItem(MediaItem.fromUri(urls.get(pos)));
              player.prepare(); player.setRepeatMode(ExoPlayer.REPEAT_MODE_ONE); player.play();
              h.btnLike.setOnClickListener(v-> Toast.makeText(ctx, "❤️ Like! Tu es abonné!", Toast.LENGTH_SHORT).show());
            }
            @Override public int getItemCount(){ return urls.size(); }
            @Override public void onViewRecycled(@NonNull VH h){ if(h.playerView.getPlayer()!=null) h.playerView.getPlayer().release(); super.onViewRecycled(h); }
            static class VH extends RecyclerView.ViewHolder{ PlayerView playerView; TextView btnLike; VH(View v){ super(v); playerView=v.findViewById(R.id.playerView); btnLike=v.findViewById(R.id.btnLike); } }
          }
          EOF
          cat > app/src/main/java/com/vyvo/app/MainActivity.java <<'EOF'
          package com.vyvo.app;
          import android.app.Activity; import android.os.Bundle; import androidx.viewpager2.widget.ViewPager2; import java.util.Arrays; import java.util.List;
          public class MainActivity extends Activity {
            @Override protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_main);
              ViewPager2 vp = findViewById(R.id.viewPager);
              List<String> videos = Arrays.asList("https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4","https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4","https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4");
              vp.setAdapter(new VideoAdapter(this, videos)); vp.setOrientation(ViewPager2.ORIENTATION_VERTICAL);
            }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vyvo-tiktok-v1-fixed
          path: app/build/outputs/apk/debug/app-debug.apk
