name: Build VYVO APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Build VYVO
        run: |
          mkdir -p app/src/main/java/com/vyvo/app
          cat > settings.gradle <<'EOF'
          include ':app'
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.vyvo.app'
            compileSdk 34
            defaultConfig {
              applicationId "com.vyvo.app"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="VYVO" android:theme="@android:style/Theme.Black.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/vyvo/app/MainActivity.java <<'EOF'
          package com.vyvo.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.*;
          import android.graphics.Color;
          import android.view.Gravity;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b){
              super.onCreate(b);
              LinearLayout l = new LinearLayout(this);
              l.setOrientation(1);
              l.setBackgroundColor(Color.BLACK);
              l.setGravity(Gravity.CENTER);
              TextView t = new TextView(this);
              t.setText("VYVO\nApp Officielle");
              t.setTextColor(Color.parseColor("#D4AF37"));
              t.setTextSize(40);
              t.setGravity(Gravity.CENTER);
              Button btn = new Button(this);
              btn.setText("ENTRER");
              l.addView(t);
              l.addView(btn);
              setContentView(l);
            }
          }
          EOF
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          ./gradle-8.4/bin/gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYVO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
