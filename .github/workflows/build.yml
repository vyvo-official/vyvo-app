name: Build VYVO TikTok V1.5
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Create App
        run: |
          mkdir -p app/src/main/java/com/vyvo/app
          mkdir -p app/src/main/res/layout
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.1.4' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.vyvo.app'
            compileSdk 34
            defaultConfig { applicationId "com.vyvo.app"; minSdk 24; targetSdk 34; versionCode 7; versionName "1.5" }
            buildTypes { release { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.viewpager2:viewpager2:1.0.0'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="VYVO TikTok" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000">
            <androidx.viewpager2.widget.ViewPager2 android:id="@+id/viewPager" android:layout_width="match_parent" android:layout_height="match_parent" />
          </FrameLayout>
          EOF
          cat > app/src/main/res/layout/item_video.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000">
            <VideoView android:id="@+id/videoView" android:layout_width="match_parent" android:layout_height="match_parent" android:layout_gravity="center"/>
            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:layout_gravity="bottom" android:padding="16dp">
              <TextView android:text="@vyvo_officiel" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#fff" android:textStyle="bold" android:textSize="18sp"/>
              <TextView android:text="VYVO TikTok V1.5 🔥" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#fff"/>
              <TextView android:id="@+id/btnLike" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="❤️ 12.5K  💬 342  ➕  🔴 LIVE" android:textColor="#ff004f" android:textStyle="bold" android:paddingTop="10dp"/>
            </LinearLayout>
          </FrameLayout>
          EOF
          cat > app/src/main/java/com/vyvo/app/VideoAdapter.java <<'EOF'
          package com.vyvo.app;
          import android.content.Context; import android.net.Uri; import android.view.*; import android.widget.*; import androidx.annotation.NonNull; import androidx.recyclerview.widget.RecyclerView; import java.util.List;
          public class VideoAdapter extends RecyclerView.Adapter<VideoAdapter.VH> {
            Context ctx; List<String> urls;
            public VideoAdapter(Context c, List<String> u){ ctx=c; urls=u; }
            @NonNull @Override public VH onCreateViewHolder(@NonNull ViewGroup p, int t){ return new VH(LayoutInflater.from(ctx).inflate(R.layout.item_video, p, false)); }
            @Override public void onBindViewHolder(@NonNull VH h, int pos){
              h.videoView.setVideoURI(Uri.parse(urls.get(pos)));
              h.videoView.setOnPreparedListener(mp->{ mp.setLooping(true); h.videoView.start(); });
              h.btnLike.setOnClickListener(v-> Toast.makeText(ctx, "❤️ Like!", Toast.LENGTH_SHORT).show());
            }
            @Override public int getItemCount(){ return urls.size(); }
            static class VH extends RecyclerView.ViewHolder{ VideoView videoView; TextView btnLike; VH(View v){ super(v); videoView=v.findViewById(R.id.videoView); btnLike=v.findViewById(R.id.btnLike); } }
          }
          EOF
          cat > app/src/main/java/com/vyvo/app/MainActivity.java <<'EOF'
          package com.vyvo.app;
          import android.app.Activity; import android.os.Bundle; import androidx.viewpager2.widget.ViewPager2; import java.util.Arrays; import java.util.List;
          public class MainActivity extends Activity {
            @Override protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_main);
              ViewPager2 vp = findViewById(R.id.viewPager);
              List<String> videos = Arrays.asList("https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4","https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4","https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4");
              vp.setAdapter(new VideoAdapter(this, videos)); vp.setOrientation(ViewPager2.ORIENTATION_VERTICAL);
            }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vyvo-tiktok-v15
          path: app/build/outputs/apk/debug/app-debug.apk
