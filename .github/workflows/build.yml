name: Build VYVO TikTok V1.5

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/vyvo/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VYVO-TikTok"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vyvo.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.vyvo.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 7
                  versionName "1.5"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.viewpager2:viewpager2:1.0.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="red">#FF004F</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:colorAccent">#FF004F</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="VYVO"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <FrameLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <androidx.viewpager2.widget.ViewPager2
                  android:id="@+id/viewPager"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical" />

          </FrameLayout>
          EOF

          cat > app/src/main/res/layout/item_video.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <FrameLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <VideoView
                  android:id="@+id/videoView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_gravity="center" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom"
                  android:orientation="vertical"
                  android:padding="18dp">

                  <TextView
                      android:id="@+id/username"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="@vyvo_officiel"
                      android:textColor="#FFFFFF"
                      android:textSize="18sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/description"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="6dp"
                      android:text="Bienvenue sur VYVO 🔥"
                      android:textColor="#FFFFFF"
                      android:textSize="15sp" />

                  <TextView
                      android:id="@+id/actions"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:text="❤️ 12.5K    💬 342    ➕    🔴 LIVE"
                      android:textColor="#FFFFFF"
                      android:textSize="17sp"
                      android:textStyle="bold" />

              </LinearLayout>

          </FrameLayout>
          EOF

          cat > app/src/main/java/com/vyvo/app/MainActivity.java <<'EOF'
          package com.vyvo.app;

          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.viewpager2.widget.ViewPager2;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {

              private ViewPager2 viewPager;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  viewPager = findViewById(R.id.viewPager);

                  List<String> videos = new ArrayList<>();

                  videos.add("https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4");
                  videos.add("https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4");
                  videos.add("https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4");

                  VideoAdapter adapter = new VideoAdapter(this, videos);
                  viewPager.setAdapter(adapter);
              }
          }
          EOF

          cat > app/src/main/java/com/vyvo/app/VideoAdapter.java <<'EOF'
          package com.vyvo.app;

          import android.content.Context;
          import android.net.Uri;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.VideoView;

          import androidx.annotation.NonNull;
          import androidx.recyclerview.widget.RecyclerView;

          import java.util.List;

          public class VideoAdapter extends RecyclerView.Adapter<VideoAdapter.VideoViewHolder> {

              private final Context context;
              private final List<String> videos;

              public VideoAdapter(Context context, List<String> videos) {
                  this.context = context;
                  this.videos = videos;
              }

              @NonNull
              @Override
              public VideoViewHolder onCreateViewHolder(
                      @NonNull ViewGroup parent,
                      int viewType) {

                  View view = LayoutInflater.from(context)
                          .inflate(R.layout.item_video, parent, false);

                  return new VideoViewHolder(view);
              }

              @Override
              public void onBindViewHolder(
                      @NonNull VideoViewHolder holder,
                      int position) {

                  String url = videos.get(position);

                  holder.videoView.setVideoURI(Uri.parse(url));

                  holder.videoView.setOnPreparedListener(mp -> {
                      mp.setLooping(true);
                      holder.videoView.start();
                  });
              }

              @Override
              public void onViewRecycled(@NonNull VideoViewHolder holder) {
                  holder.videoView.stopPlayback();
                  super.onViewRecycled(holder);
              }

              @Override
              public int getItemCount() {
                  return videos.size();
              }

              static class VideoViewHolder extends RecyclerView.ViewHolder {

                  VideoView videoView;

                  VideoViewHolder(@NonNull View itemView) {
                      super(itemView);
                      videoView = itemView.findViewById(R.id.videoView);
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYVO-TikTok-V1.5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
EOF
